name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

# Si llegan dos push seguidos, cancela el run anterior: no interesa el
# resultado de un commit que ya esta superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # El proyecto NO esta en la raiz del repo, vive en esta subcarpeta.
    # Sin esto, npm no encuentra package.json y el job muere en el primer paso.
    defaults:
      run:
        working-directory: tartis-recon-ai-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La dependencia mas exigente es eslint 10 (^20.19 || ^22.13 || >=24).
          # Node 22 las cumple todas; no hay .nvmrc en el repo que fije otra.
          node-version: '22'
          cache: npm
          # La cache NO respeta defaults.working-directory: sin esta ruta busca
          # el lock en la raiz del repo, no lo encuentra y falla.
          cache-dependency-path: tartis-recon-ai-frontend/package-lock.json

      # 'npm ci' y no 'npm install': instala exactamente lo que fija el lock y
      # falla si lock y package.json se desincronizan, en vez de resolver
      # versiones distintas en cada build.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      # 'build' ejecuta 'tsc -b' antes de vite: este paso tambien es quien
      # comprueba los tipos. No hace falta un typecheck aparte.
      - name: Build
        run: npm run build

  # RECON-813: escaneo de vulnerabilidades de la imagen final con Trivy.
  # Job separado y en paralelo a build-and-test: el Dockerfile hace su propio
  # 'npm run build' por dentro, meterlo como step secuencial duplicaria el
  # build de Vite en el camino critico del pipeline.
  docker-scan:
    runs-on: ubuntu-latest

    # security-events: write es lo que permite subir el SARIF a la pestana
    # Security. Se declara aqui y no a nivel de workflow para que
    # build-and-test siga con el 'contents: read' minimo.
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # load: true deja la imagen en el daemon local para que Trivy la lea por
      # nombre; push: false, aqui no se publica nada. cache-from/to reutiliza
      # las capas (incluida la de dependencias npm) entre runs.
      - name: Construir imagen
        uses: docker/build-push-action@v7.3.0
        with:
          context: tartis-recon-ai-frontend
          push: false
          load: true
          tags: parking-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Primero el SARIF con exit-code 0: asi el informe llega a la pestana
      # Security aunque el gate de abajo tumbe el job.
      - name: Trivy - informe SARIF (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parking-frontend:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Subir SARIF a la pestana Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # El gate real: solo CRITICAL tumba el job. Trivy lee automaticamente el
      # .trivyignore de la raiz del repo si existe, que es el mecanismo para
      # ignorar explicitamente una CVE concreta.
      - name: Trivy - quality gate (CRITICAL bloquea)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: parking-frontend:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: '1'
