# Reverse proxy hacia Kong (misma red Docker 'parking-shared') + servido de
# la SPA con fallback a index.html para el router del cliente.
#
# GW-07 cerró los puertos directos de los microservicios: ya no se puede
# (ni se debe) hacer proxy_pass directo a vehicle-service/spot-service/etc.
# Todo pasa por Kong bajo /api/v1/*, con validación JWT real.
#
# /assets/ lleva cabeceras CORS porque remoteEntry.js y los chunks de Module
# Federation los piden en runtime los remotos (mfe-entryexit, mfe-admin)
# desde otro origen — sin esto, import('shell/AuthProvider') falla por CORS
# antes incluso de llegar al problema de shared singleton.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # Pass-through sin reescribir: el navegador pide la misma ruta que Kong
    # publica. Antes esto traducia /v1/* -> /api/v1/*, lo que obligaba a la
    # shell a hablar un prefijo distinto al de los remotos y al de kong.yml.
    location /api/v1/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/events {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Los remotos de Module Federation (mfe-entryexit, mfe-admin) solo se
    # sirven detras de Kong (kong/kong.yml, rutas /mfe/*). Sin este proxy,
    # entrando por el puerto directo del contenedor (8090) en vez de por Kong
    # (8000), la peticion a /mfe/entryexit/assets/remoteEntry.js no matchea
    # ningun location de aqui abajo y cae en el fallback de la SPA: devuelve
    # index.html con 200, el runtime de federation no puede parsearlo como
    # contenedor y el modulo aparece como no disponible.
    location /mfe/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # remoteEntry.js tiene URL fija y apunta a chunks con hash. Si el navegador
    # lo cachea, tras un deploy sigue pidiendo hashes que ya no existen: 404 y
    # modulo no disponible, sin que un ctrl+shift+r lo arregle. Los MFE
    # necesitan lo mismo en sus propios nginx.
    #
    # Match exacto a proposito: una regex ~ /remoteEntry\.js$ tendria prioridad
    # sobre el prefijo /mfe/ de arriba y se tragaria tambien los remoteEntry de
    # los MFE, sirviendolos del disco local en vez de pasarlos a Kong (404).
    location = /assets/remoteEntry.js {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Cache-Control' 'no-store' always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        # Sin 'always' a proposito: asi nginx no se lo pone a un 404, que
        # quedaria cacheado un ano. Los chunks llevan hash, son inmutables.
        add_header 'Cache-Control' 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }

    # index.html referencia los chunks con hash: cachearlo deja al navegador
    # pidiendo la version anterior de toda la app.
    location = /index.html {
        add_header 'Cache-Control' 'no-store' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
