# Sirve la SPA (con fallback a index.html para el router del cliente) y
# reenvia las llamadas a la API hacia Kong.
#
# Antes hacia proxy_pass directo a cada microservicio, saltandose el gateway.
# Eso convertia en decorativa toda la validacion JWT de Kong: medido en el
# puerto 8090 SIN NINGUNA CREDENCIAL, /v1/spots y /v1/tariffs devolvian 200 con
# datos (vehicles y stays daban 401 solo porque tienen su propio Spring
# Security detras). Cualquiera con acceso al puerto del frontend leia el
# inventario de plazas y el tarifario. Ver la nota E2E del 30/07 en el vault.
#
# Ahora la unica salida es Kong, que aplica jwt, cors y correlation-id a las 7
# rutas. Kong las publica como /api/v1/... y el frontend llama a /v1/..., asi
# que cada location traduce el prefijo; Kong hace strip_path y el microservicio
# vuelve a recibir /v1/..., que es lo que espera.
#
# CONSECUENCIA CONOCIDA Y BUSCADA: el frontend todavia no manda Authorization
# (faltan keycloak-js y el interceptor de request de Axios, bloque SEC
# pendiente), asi que de momento estas rutas responden 401 en vez de 200. El
# 200 anterior era el agujero, no la funcionalidad. En cuanto el cliente mande
# el Bearer esto funciona sin tocar nada mas: nginx propaga Authorization tal
# cual, no hay que listarla aqui.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Heredadas por todos los location de abajo. Kong enruta solo por path (no
    # hay match por Host en kong/kong.yml), pero se mandan igual para que sus
    # logs y el correlation-id reflejen el origen real de la peticion.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/vehicles {
        proxy_pass http://kong:8000/api/v1/vehicles;
    }

    location /v1/spots {
        proxy_pass http://kong:8000/api/v1/spots;
    }

    location /v1/tariffs {
        proxy_pass http://kong:8000/api/v1/tariffs;
    }

    location /v1/stays {
        proxy_pass http://kong:8000/api/v1/stays;
    }

    location /v1/tickets {
        proxy_pass http://kong:8000/api/v1/tickets;
    }

    location /v1/entry-tickets {
        proxy_pass http://kong:8000/api/v1/entry-tickets;
    }

    location /v1/receipts {
        proxy_pass http://kong:8000/api/v1/receipts;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
