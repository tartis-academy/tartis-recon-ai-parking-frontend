# Reverse proxy hacia Kong (misma red Docker 'parking-shared') + servido de
# la SPA con fallback a index.html para el router del cliente.
#
# GW-07 cerró los puertos directos de los microservicios: ya no se puede
# (ni se debe) hacer proxy_pass directo a vehicle-service/spot-service/etc.
# Todo pasa por Kong bajo /api/v1/*, con validación JWT real.
#
# /assets/ lleva cabeceras CORS porque remoteEntry.js y los chunks de Module
# Federation los piden en runtime los remotos (mfe-entryexit, mfe-admin)
# desde otro origen — sin esto, import('shell/AuthProvider') falla por CORS
# antes incluso de llegar al problema de shared singleton.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /v1/ {
        rewrite ^/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /v1/events {
        rewrite ^/v1/events$ /api/v1/events break;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /assets/ {
        add_header 'Access-Control-Allow-Origin' '*' always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
